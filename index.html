<style>

body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f6f9;
transition:0.3s;
}

.dark-mode{
background:#1e1e1e;
color:#f5f5f5;
}

.dark-mode #calendar,
.dark-mode .side-list{
background:#2a2a2a;
}

h1{
text-align:center;
margin:15px 0;
}

.container{
display:flex;
gap:20px;
padding:20px;
}

#calendar{
flex:3;
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
transition:opacity 0.3s ease;
}

.side-list{
flex:1;
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
max-height:80vh;
overflow-y:auto;
}

.side-list h3{
margin-top:0;
}

.fc-day-mon{
background:#fdf6e3!important;
}

.filters{
text-align:center;
margin-bottom:10px;
}

.filters button{
margin:4px;
padding:8px 14px;
border-radius:8px;
border:none;
cursor:pointer;
color:white;
font-weight:bold;
transition:transform .2s;
}

.filters button:hover{
transform:scale(1.05);
}

.rota1-btn{background:#1abc9c;}
.rota2-btn{background:#3498db;}
.rota3-btn{background:#9b59b6;}
.rota4-btn{background:#f39c12;}
.eventos-btn{background:#2c3e50;}
.limpar-btn{background:#7f8c8d;}

.highlight-event{
animation:pulseHighlight 1s ease-in-out 3;
box-shadow:0 0 15px 4px rgba(255,0,0,.6)!important;
border-radius:6px!important;
}

@keyframes pulseHighlight{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

.tooltip-box{
position:absolute;
background:white;
padding:10px;
border-radius:8px;
box-shadow:0 4px 15px rgba(0,0,0,.2);
font-size:14px;
z-index:9999;
}

.dark-mode .tooltip-box{
background:#333;
color:white;
}

.event-legend{
margin-top:15px;
font-size:14px;
color:#666;
}

.dark-mode .event-legend{
color:#bbb;
}

@media(max-width:900px){
.container{
flex-direction:column;
}
}

</style>
</head>

titulo=e.cidade+" *";
}

let dataFinal=new Date(e.dataFim);
if(isNaN(dataFinal)) return null;

dataFinal.setDate(dataFinal.getDate()+1);

return{

title:titulo,
start:e.dataInicio,
end:dataFinal.toISOString().split("T")[0],

backgroundColor:cor,
borderColor:cor,

extendedProps:{
rota:e.caminhao,
tipo:e.tipo,
cidade:e.cidade,
dataInicio:e.dataInicio,
dataFim:e.dataFim
}

};

})

.filter(e=>e!==null);

}

function renderizar(){

document.getElementById("calendar").style.opacity=.3;

setTimeout(()=>{

calendar.removeAllEvents();
calendar.addEventSource(montarEventos());
atualizarListaMes();

document.getElementById("calendar").style.opacity=1;

},200);

}

function filtrarRota(r){
filtroAtual=r;
somenteEventos=false;
renderizar();
}

function verEventos(){
filtroAtual=null;
somenteEventos=true;
renderizar();
}

function limparFiltros(){
filtroAtual=null;
somenteEventos=false;
renderizar();
}

function atualizarListaMes(){

const view=calendar.view;

const inicioMes=view.currentStart;
const fimMes=view.currentEnd;

const lista=document.getElementById("listaMunicipios");
lista.innerHTML="";

const municipios=DATA.calendario.filter(e=>{

const dataInicio=new Date(e.dataInicio);

return dataInicio>=inicioMes && dataInicio<fimMes;

});

const unicos=[...new Map(municipios.map(e=>[e.cidade,e])).values()];

unicos.forEach(e=>{

const li=document.createElement("li");

li.textContent=e.cidade;
li.style.cursor="pointer";
li.style.marginBottom="6px";

li.onclick=function(){
destacarEvento(e.cidade);
};

lista.appendChild(li);

});

}

function destacarEvento(nomeCidade){

const eventos=calendar.getEvents();

const evento=eventos.find(ev=>ev.title.startsWith(nomeCidade));

if(!evento) return;

calendar.gotoDate(evento.start);

setTimeout(()=>{

const elementos=document.querySelectorAll(".fc-event");

elementos.forEach(el=>{

if(el.innerText.startsWith(nomeCidade)){

el.classList.add("highlight-event");

setTimeout(()=>{
el.classList.remove("highlight-event");
},3000);

}

});

},300);

}

document.addEventListener("DOMContentLoaded",function(){

calendar=new FullCalendar.Calendar(
document.getElementById("calendar"),
{
initialView:"dayGridMonth",
locale:"pt-br",
height:"auto",
events:montarEventos(),

datesSet:function(){
atualizarListaMes();
},

eventClick:function(info){

const e=info.event.extendedProps;

const tooltip=document.createElement("div");

tooltip.className="tooltip-box";

tooltip.innerHTML=`
<strong>${info.event.title}</strong><br>
Rota: ${e.rota}<br>
Tipo: ${e.tipo}<br>
Início: ${e.dataInicio}<br>
Fim: ${e.dataFim}
`;

document.body.appendChild(tooltip);

tooltip.style.left=info.jsEvent.pageX+"px";
tooltip.style.top=info.jsEvent.pageY+"px";

setTimeout(()=>tooltip.remove(),4000);

}

}
);

calendar.render();
atualizarListaMes();

});

</script>

</body>
</html>
